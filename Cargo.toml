[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"
repository = "https://github.com/krabka-io/krabka-schema-registry"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Intentional while the public API is still pre-1.0; re-evaluate once the API
# surface stabilises.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
arc-swap = "1"
anyhow = "1"
# Schema parsing and canonical form for the Avro compatibility engine.
apache-avro = "0.22"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
hex = "0.4"
jsonschema = { version = "0.58", default-features = false }
parking_lot = "0.12"
prost = "0.14"
prost-reflect = "0.16"
refined_type = "0.6"
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-util = { version = "0.7", default-features = false }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# First-party crates inherited by more than one member.
krabka-units = "0.5.0"
krabka-schema-serde = { version = "0.4.1", path = "crates/schema-serde" }
# The in-process broker that the test suites of both members start. It is a git
# dependency, not a crates.io requirement, because krabka-broker is not on
# crates.io: `cargo publish` drops a dev-dependency without a `version`, so the
# published krabka-schema-serde does not name it. Keep `rev` equal to the
# krabka-broker rows of the patch block below.
krabka-broker = { git = "https://github.com/krabka-io/krabka-broker", rev = "d2ee0d14003c7ccc52d792db495120f48e13028e" }

# Sibling repositories, pinned by revision. These crates are declared against
# crates.io above and in the member manifests; the patch below is the single
# place a sibling revision is bumped.
#
# `krabka-schema-serde` patches to the local path on purpose. This workspace
# builds it, and `krabka-broker` — which the integration suites dev-depend on —
# depends on it too. Without the patch the graph would carry two copies of the
# same crate from two sources.
[patch.crates-io]
