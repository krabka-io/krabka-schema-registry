[package]
name = "krabka-schema-serde"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Confluent-compatible schema serdes (Avro/Protobuf/JSON) for Krabka clients"
repository.workspace = true
documentation = "https://docs.rs/krabka-schema-serde"
readme = "README.md"
keywords = ["kafka", "schema", "avro", "protobuf", "krabka"]
categories = ["encoding", "api-bindings"]
# Ship the library source, its README, and the LICENSE and NOTICE that
# Apache-2.0 requires with a distribution (symlinks to the repository-root
# copies). The tests and their fixtures stay in the repository.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lints]
workspace = true

[features]
default = []
avro = ["dep:apache-avro"]
protobuf = ["dep:prost", "dep:prost-reflect", "dep:protox-parse"]
json = ["dep:schemars", "dep:jsonschema"]

[dependencies]
assert2 = { workspace = true }
bytes = { workspace = true }
krabka-units = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
apache-avro = { workspace = true, features = ["derive"], optional = true }
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
protox-parse = { version = "0.9", optional = true }
schemars = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }

[dev-dependencies]
# No `version`, so that `cargo publish` drops it. See the workspace entry.
krabka-broker = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
serde_json = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"

[[test]]
name = "jvm_fixtures"
required-features = ["avro", "json", "protobuf"]
