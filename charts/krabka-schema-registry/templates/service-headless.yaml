apiVersion: v1
kind: Service
metadata:
  name: {{ include "krabka-schema-registry.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "krabka-schema-registry.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # A pod that is elected primary before it passes its readiness probe must
  # still resolve, or the secondaries cannot forward writes to it.
  publishNotReadyAddresses: true
  ports:
    - port: 8081
      targetPort: rest
      protocol: TCP
      name: rest
  selector: {{- include "krabka-schema-registry.selectorLabels" . | nindent 4 }}
