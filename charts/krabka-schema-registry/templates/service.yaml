apiVersion: v1
kind: Service
metadata:
  name: {{ include "krabka-schema-registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "krabka-schema-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: rest
      protocol: TCP
      name: rest
  selector: {{- include "krabka-schema-registry.selectorLabels" . | nindent 4 }}
