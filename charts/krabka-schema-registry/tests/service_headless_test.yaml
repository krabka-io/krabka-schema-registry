suite: headless service
templates:
  - service-headless.yaml
release:
  name: sr
  namespace: kafka
set:
  bootstrapServers: broker:9092
tests:
  - it: publishes pod addresses before the pods are ready
    asserts:
      - equal:
          path: metadata.name
          value: sr-krabka-schema-registry-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: reserves room for the suffix in a 63-character name
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-headless
