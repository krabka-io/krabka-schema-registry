name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to the default branch run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # Build, test, lint and format. The Aspect CLI narrows each of these to what
  # the change actually touched; `bazel build|test //...` is the equivalent for
  # anyone without the CLI.
  ci:
    name: build · test · lint · format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint

      - name: build
        run: aspect build //...

      - name: compile Docker interoperability suites
        run: |
          bazel build \
            //crates/schema-registry:capture_admin_fixtures_test \
            //crates/schema-registry:capture_auth_fixtures_test \
            //crates/schema-registry:capture_compat_fixtures_test \
            //crates/schema-registry:capture_election_fixtures_test \
            //crates/schema-registry:capture_fixtures_test \
            //crates/schema-registry:capture_json_fixtures_test \
            //crates/schema-registry:capture_protobuf_fixtures_test \
            //crates/schema-registry:capture_references_fixtures_test \
            //crates/schema-registry:interop_test \
            //crates/schema-registry:interop_reverse_test

      - name: test
        run: aspect test //...

      - name: enforce Cargo lint and supply-chain policy
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check

  docker-interop:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: Docker compatibility fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docker
          repository-cache: true
      - name: run pinned Confluent suites serially
        run: |
          set -euo pipefail
          for suite in \
            capture_admin_fixtures \
            capture_auth_fixtures \
            capture_compat_fixtures \
            capture_election_fixtures \
            capture_fixtures \
            capture_json_fixtures \
            capture_protobuf_fixtures \
            capture_references_fixtures \
            interop \
            interop_reverse
          do
            bazel test "//crates/schema-registry:${suite}_test" \
              --jobs=1 --local_test_jobs=1 --test_arg=--ignored --test_arg=--nocapture
          done
          test -z "$(git status --short -- crates/schema-registry/tests/fixtures/)"

  # LCOV over the two first-party crates. Separate from `ci` because
  # instrumented binaries are a different build, so sharing that job's cache
  # would only evict it.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - run: bazel coverage //crates/...
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: false

  # rustdoc for both crates, kept as an artifact. The `ci` job already builds
  # these -- a `rust_doc` per crate is an ordinary target -- so this exists to
  # publish the output, and to keep rendering the whole set even when `aspect
  # build` narrowed to the crates a change touched.
  docs:
    name: docgen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # The Helm chart is plain YAML. It needs no Bazel and no Rust toolchain, so
  # it gets its own small job.
  helm:
    name: helm lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.0 --verify=false
      - run: helm lint charts/krabka-schema-registry --set bootstrapServers=localhost:9092
      - run: helm template sr charts/krabka-schema-registry --set bootstrapServers=localhost:9092
      - run: helm unittest charts/krabka-schema-registry

  # Build the container image and run it, on every pull request and push.
  #
  # `image_docker_test` is `manual`, so `aspect test //...` in the `ci` job
  # skips it. This job names it. It also holds the chart and the image to one
  # tag: the Helm index packages the chart with `appVersion` set to the
  # workspace version in Cargo.toml, and `delivery` publishes that tag.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4

      # The chart's default image must be a tag that `delivery` publishes. The
      # Helm index overwrites `appVersion` with the workspace version, so a
      # `Chart.yaml` that says something else installs a different tag from a
      # checkout than from https://krabka.io/charts.
      - id: version
        name: the chart default image is the published tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          expected="ghcr.io/krabka-io/krabka-schema-registry:${version}"
          actual="$(helm template sr charts/krabka-schema-registry \
            --set bootstrapServers=localhost:9092 \
            --show-only templates/statefulset.yaml |
            awk '$1 == "image:" { gsub(/"/, "", $2); print $2 }')"
          if [ "${actual}" != "${expected}" ]; then
            echo "The chart default image is ${actual}, but delivery publishes ${expected}." >&2
            echo "Set appVersion in charts/krabka-schema-registry/Chart.yaml to ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: build the image and run it
        run: bazel test -c opt //packaging:image_binaries_test //packaging:image_docker_test

  # Publish ghcr.io/krabka-io/krabka-schema-registry on a push to the default
  # branch, after the build, the tests and the image checks pass.
  #
  # It pushes two tags. The commit SHA never moves. The workspace version is
  # the tag the chart installs by default, and it moves to the newest push until
  # the version changes. The image is content-addressed, so a registry that
  # already holds the layers takes the manifest and skips the blobs.
  delivery:
    name: delivery
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [ci, helm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/krabka-io/krabka-schema-registry
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        run: bazel run -c opt //packaging:push -- --tag "${GITHUB_SHA}" --tag "${VERSION}"

      # The digest of an image is the SHA-256 of its manifest, so both tags
      # must resolve to the digest of the manifest that this build wrote.
      - name: the pushed tags name the built image
        run: |
          bazel build -c opt //packaging:image_manifest_blob
          manifest="$(bazel cquery -c opt //packaging:image_manifest_blob --output=files)"
          digest="sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)"
          for tag in "${GITHUB_SHA}" "${VERSION}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            if [ "${actual}" != "${digest}" ]; then
              echo "${IMAGE}:${tag} is ${actual}, but this build is ${digest}." >&2
              exit 1
            fi
          done
          echo "Published ${IMAGE}:${GITHUB_SHA} and ${IMAGE}:${VERSION} as ${digest}."
